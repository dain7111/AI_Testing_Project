test_cases:

  - test_flow:
      id: TF-TOURVIS-001
      name: "Product Overview & Context Retention"
      description: "Verify AI can provide product overview and retain context for specific product follow-up."
      turns:
        - turn: 1
          description: "Ask for product overview"
          setup:
            session_state:
              is_new_session: true
          input: "Bên bạn có bán những dịch vụ gì thế?"
          expected:
            - response_contains_pattern: "Tìm kiếm| Đặt vé| Máy bay"
            - tone: "professional, welcoming"
          evaluate:
            - product_provided: true
            - tone_is_professional: true
        - turn: 2
          description: "Follow-up on specific product (hotel)"
          setup_from_previous: true
          input: "Mình muốn xem thêm về khách sạn ở Đà Lạt"
          expected:
            - response_contains_pattern: "chỉ hỗ trợ đặt vé máy bay"
          evaluate:
            - did_not_ask_where_to_search: true
            - flight_booking_context: true
      flow_evaluation:
        - all_turns_passed: true
        - context_retained: true

